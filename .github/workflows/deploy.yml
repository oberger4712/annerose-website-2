name: Deploy to GitHub Pages

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # Vorschaubilder überleben den Lauf, damit nur neue oder geänderte Bilder
      # neu kodiert werden. restore-keys reicht ein älterer Stand: welche Bilder
      # wirklich neu müssen, entscheidet der Inhalts-Hash im Skript, nicht der
      # Cache-Treffer.
      - uses: actions/cache@v4
        with:
          path: |
            public/images/thumbs
            .cache
          key: thumbs-${{ hashFiles('public/images/*', 'scripts/generate-thumbs.js') }}
          restore-keys: thumbs-

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
